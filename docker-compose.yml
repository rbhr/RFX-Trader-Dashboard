volumes:
  portainer_data:
  caddy_data:
  caddy_config:

services:
  portainer:
    command: "-H unix:///var/run/docker.sock"
    container_name: portainer
    environment:
      - TZ=Australia/Adelaide
      - CAP_HOST_MANAGEMENT=1
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    restart: always
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host

  rfx-app:
    build:
      context: .
      args:
        BUILD_HASH: ${BUILD_HASH:-dev}
        VITE_LIVE_STREAM: ${VITE_LIVE_STREAM:-false}
    container_name: rfx-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql://rfx:${MYSQL_PASSWORD}@mysql:3306/rfx_trader
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - internal

  mysql:
    image: mysql:8.0
    container_name: rfx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: rfx_trader
      MYSQL_USER: rfx
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: rfx-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rfx-app
    networks:
      - internal


networks:
  internal:
