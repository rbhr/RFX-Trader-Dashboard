# RFX Trader Dashboard — app + MySQL only.
#
# TLS and hostname routing are handled by the shared edge Caddy defined in the
# parent folder (../docker-compose.yml), which also `include`s this file. The
# app joins the external rfx_edge network so that Caddy can reach it by name as
# rfx-trader-dashboard:3000.
#
# Operate the whole platform from the parent folder, or just this stack from
# here:
#   docker compose up -d --build rfx-app

services:
  rfx-app:
    build:
      context: .
      args:
        BUILD_HASH: ${BUILD_HASH:-dev}
        VITE_LIVE_STREAM: ${VITE_LIVE_STREAM:-false}
    # The edge Caddy proxies tradersdash.* to this container name.
    container_name: rfx-trader-dashboard
    restart: unless-stopped
    depends_on:
      dashboard-mysql:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: mysql://rfx:${MYSQL_PASSWORD}@mysql:3306/rfx_trader
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - internal
      - rfx_edge # reachable by the edge Caddy as rfx-trader-dashboard:3000

  # Renamed from "mysql" so it doesn't collide with the website stack's MySQL
  # when both are included into one project from the parent folder. The app
  # still connects to it as "mysql" via the network alias below, so
  # DATABASE_URL is unchanged.
  dashboard-mysql:
    image: mysql:8.0
    container_name: rfx-dash-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: rfx_trader
      MYSQL_USER: rfx
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      internal:
        aliases:
          - mysql

  # NOTE: TLS / reverse proxy and Portainer are now defined once in the parent
  # folder's docker-compose.yml. This stack no longer runs its own copies —
  # they collided by name with the edge stack's services when included.

networks:
  internal:
  rfx_edge:
    external: true
